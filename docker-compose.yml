version: '3.8'

services:
  # API
  api:
    container_name: agenda-edu-api
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development  # Mudei para development
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=agendaedu
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - app-network

  # PostgreSQL
  postgres:
    container_name: agenda-edu-db
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=agendaedu
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Jenkins (MAIS SEGURO)
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
    - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    networks:
      - app-network
    user: root

volumes:
  postgres_data:
  jenkins_data:

networks:
  app-network:
    driver: bridge