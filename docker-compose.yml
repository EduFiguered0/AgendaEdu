version: '3.8'

services:
  # API
  api:
    container_name: agenda-edu-api
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    networks:
      - app-network

  # PostgreSQL (para quando implementarmos)
  postgres:
    container_name: agenda-edu-db
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=agendaedu
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge